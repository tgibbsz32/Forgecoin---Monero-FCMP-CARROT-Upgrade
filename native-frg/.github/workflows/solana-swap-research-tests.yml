name: Solana native-swap research simulations

on:
  pull_request:
    paths:
      - "services/atomic_swap_research/**"
      - ".github/workflows/solana-swap-research-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-research-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run offline Solana escrow and private RFQ accounting tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s services/atomic_swap_research/tests -p 'test_*.py' -v
      - name: Ensure production settlement hooks remain unavailable
        run: |
          python - <<'PY'
          from services.atomic_swap_research.solana_escrow_sim import request_real_solana_swap
          from services.atomic_swap_research.dark_pool_sim import (
              request_custodial_settlement,
              request_blind_relay,
          )
          for hook in (
              request_real_solana_swap,
              request_custodial_settlement,
              request_blind_relay,
          ):
              try:
                  hook()
              except (RuntimeError, NotImplementedError):
                  continue
              raise AssertionError(f"Production interface unexpectedly enabled: {hook}")
          print("PASS: all live settlement and relay hooks fail closed")
          PY
