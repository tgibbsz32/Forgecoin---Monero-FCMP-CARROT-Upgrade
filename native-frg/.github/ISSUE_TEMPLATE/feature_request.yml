name: Feature request
description: Propose a compatible ForgeCoin improvement
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user or network problem this would solve.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: dropdown
    id: consensus
    attributes:
      label: Does this change consensus rules
      options:
        - No
        - Unsure
        - Yes
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Compatibility and security considerations
