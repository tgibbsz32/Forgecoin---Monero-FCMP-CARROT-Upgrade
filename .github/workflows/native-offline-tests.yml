name: Native FRG offline service tests
on:
  pull_request:
    paths:
      - 'native-frg/apps/explorer/**'
      - 'native-frg/services/pool_research/**'
      - '.github/workflows/native-offline-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Flask==3.1.3
      - name: Fixture tests only; no node, miner or wallet
        working-directory: native-frg
        run: python -m unittest apps.explorer.test_app services.pool_research.test_model -v
