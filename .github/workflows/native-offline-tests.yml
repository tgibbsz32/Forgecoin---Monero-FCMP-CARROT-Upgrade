name: Native FRG offline service tests
on:
  pull_request:
    paths:
      - 'native-frg/apps/explorer/**'
      - 'native-frg/services/pool_research/**'
      - 'native-frg/tools/*fcmp*'
      - '.github/workflows/native-offline-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Flask==3.1.3
      - name: Fixture tests only; no node, miner or wallet
        working-directory: native-frg
        run: python -m unittest apps.explorer.test_app services.pool_research.test_model tools.test_fcmp_port_preflight -v
      - name: Require unported consensus to remain blocked
        working-directory: native-frg
        shell: bash
        run: |
          set +e
          python tools/fcmp_port_preflight.py --fork-root . --require-integrated > fcmp-result.json
          result=$?
          set -e
          test "$result" -eq 2
          python -c 'import json; r=json.load(open("fcmp-result.json")); assert r["not_an_audit"] and not r["fork"]["source_presence_complete"]'
